name:                auto-grading
version:             0.1.0.0
github:              "gwnJoost/auto-grading"
license:             BSD-3-Clause
author:              "Joost Peters"
maintainer:          "joost.peters@student.uva.nl"
copyright:           "2026 Joost Peters"

extra-source-files:
- README.md
- CHANGELOG.md
- src/Parse/Lex.x
- src/Parse/Parse.y

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/gwnJoost/auto-grading#readme>

dependencies:
- base >= 4.7 && < 5
- array

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

build-tools:
  - alex
  - happy

library:
  source-dirs: src

executables:
  auto-grading-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - auto-grading

tests:
  auto-grading-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - auto-grading
